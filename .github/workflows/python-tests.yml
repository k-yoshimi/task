name: python-tests

on:
  pull_request:
    # `chore/pre-push-hook-worktree-compat` is the de-facto main line on
    # this fork (765+ commits ahead of master). Without it here, PRs
    # targeting that branch (i.e. every recent feature PR) silently
    # bypass GitHub Actions — the appearance of a passing pipeline on
    # PRs #178-#183 came from Cursor Bugbot, not this workflow.
    branches: [develop, master, chore/pre-push-hook-worktree-compat]
  push:
    branches: [develop, master, chore/pre-push-hook-worktree-compat]

# Cancel superseded runs on the same branch to save minutes
concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Hard upper bound on the whole job: if any test enters a genuine
    # infinite loop inside libXapi.so (runaway physics iteration, not a
    # clean STOP), per-test --timeout=signal cannot interrupt it — the
    # child is spinning in C/Fortran and never returns to Python. This
    # cap ensures the runner aborts instead of hanging up to the
    # default 360 min. Typical runtime is ~12 s; 10 min is plenty of
    # slack for a slow CI host without wasting minutes on a hung test.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Fortran/C build deps
        # gfortran + gcc + make are needed to build the libXapi.so
        # shared libraries that the Layer 1 equivalence and FFI tests
        # dlopen at runtime. Without these the tests SKIP and CI gives a
        # false pass — which previously masked real fp/eq drift.
        #
        # Use Ubuntu 24.04's default gfortran (13.3.0; the apt metapackage
        # prints 4:13.2.0-7ubuntu1, which is not the compiler). PR #138
        # experimented with gfortran-14 from the toolchain PPA on the
        # hypothesis that the SIGABRT class was a 13.2 codegen bug; the
        # actual root cause was the BPSD species_kid OOB write fixed
        # by the patch applied in the next step. With gfortran-14 the
        # FP results drift from the Phase-0 baselines (generated with
        # 13.x) by ~1e-9 — beyond the 1e-10 equivalence tolerance — so
        # we stay on the image default. (That default is gfortran 13.3.0,
        # measured; the "13.2" in this comment and in older commit
        # messages is the apt metapackage revision 4:13.2.0-7ubuntu1 --
        # see docs/baseline-policy.md.)
        #
        # X11 is intentionally NOT installed: each lib*api.so excludes
        # graphics archives (see fp/Makefile:318), so X11 is never
        # linked into the .so files we build here.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran gcc make valgrind
          gfortran --version | head -1

      - name: Clone BPSD (patched fork k-yoshimi/bpsd@develop)
        # All module Makefiles reference BPSD_SRC=../../bpsd; the BPSD
        # source is not vendored into this repo. We clone the `develop`
        # branch of https://github.com/k-yoshimi/bpsd which is a personal
        # fork of https://github.com/ats-fukuyama/bpsd carrying two
        # patches on top of upstream main:
        #
        # (1) species_kid OOB write in bpsd_setup_species_kdata
        #     (task-private #140, upstream emailed 2026-04-22)
        # (2) INTENT(OUT) scalars undefined in bpsd_get_plasmaf
        #     (task-private #148, upstream emailed 2026-04-22)
        #
        # When upstream merges either fix, rebase develop onto upstream
        # main — the corresponding commit drops out naturally. Full
        # sync workflow + recovery procedure in
        # docs/external-patches/bpsd-fork.md.
        run: |
          set -e
          if ! git clone --depth 1 --branch develop \
                 https://github.com/k-yoshimi/bpsd.git \
                 "$GITHUB_WORKSPACE/../bpsd"; then
            echo "ERROR: Could not clone k-yoshimi/bpsd@develop." >&2
            echo "       The fork or its develop branch may be missing." >&2
            echo "       See docs/external-patches/bpsd-fork.md for recovery." >&2
            exit 1
          fi
          ls -la "$GITHUB_WORKSPACE/../bpsd" | head -5

      - name: Provision mtxp/make.mtxp from nompi template
        # mtxp/make.mtxp is gitignored (per-system config). The nompi
        # template builds bnd/pcg backends without MPI / MUMPS / PETSc,
        # which is what every libXapi.so PIC build path uses.
        run: |
          cp mtxp/make.mtxp.nompi mtxp/make.mtxp
          head -5 mtxp/make.mtxp

      - name: Provision make.header for Linux gfortran (no graphics)
        # make.header is gitignored (per-system config). Generate the
        # minimal gfortran setup needed by every module's Makefile.
        # GFLIBS is left empty because libXapi.so excludes graphics
        # (the actual `make X` binary builds need GFLIBS but those are
        # not built in CI).
        #
        # KEEP IN SYNC with the mono-build job's identically-named step
        # below — both heredocs must be byte-identical (see drift-risk
        # rationale in that step's comment).
        run: |
          cat > make.header <<'HEADER_EOF'
          ### CI-generated make.header (Linux gfortran, no graphics, no MPI)
          LAPACK = nolapack.f
          LIBLA =
          MODLA95 =
          MDSPLUS = nomdsplus.f
          MDSLIB =
          MF77 = mpif77
          MF90 = mpif90
          MF95 = mpif90
          MFC  = $(MF90)

          ## linux gfortran (64bit), no graphics linkage (libXapi.so path)
          GFLIBS=
          OFLAGS = -g -O3 -m64 -std=legacy
          DFLAGS = -g -m64 -fbounds-check -ffpe-trap=invalid,zero,overflow -fbacktrace -fcheck=all -std=legacy
          FCFIXED = gfortran -ffixed-form
          FCFREE = gfortran -ffree-form
          MOD = mod
          MODDIR = -Jmod
          LD=ld
          LDFLAGS=-r -o
          FPP=
          HEADER_EOF
          head -10 make.header

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock pytest-subtests pytest-forked pytest-timeout
          # tomli is needed only on <3.11; keep installed for safety on 3.11 too.
          pip install tomli
          # mcp = Anthropic's official Python MCP SDK. Required by the
          # build_server / TestBuildServer classes in
          # python/mcp-servers/<mod>/tests/test_server.py — without it
          # 9 tests across 6 modules silently skipUnless'd
          # (MCP_AVAILABLE = False). See server.py's optional-import
          # block; CI now exercises the FastMCP construction path that
          # production users hit.
          # Pinned below 2.0: mcp 2.0.0 removed `mcp.server.fastmcp`
          # entirely (replaced by MCPServer/Server with a different
          # decorator API), so every server.py falls back to
          # MCP_AVAILABLE=False and the stdio servers refuse to start.
          # Porting the 7 servers to the 2.x API is its own change.
          pip install 'mcp>=0.9,<2'
          # Tripwire. MCP_AVAILABLE is set by a bare `except Exception`,
          # so ANY future breakage of the FastMCP import path -- a bad
          # transitive resolution, a circular import, a real regression --
          # would silently turn the 7 server test-suites green-by-skip.
          # In THIS environment those tests must actually run, so assert it.
          PYTHONPATH=python:python/mcp-servers python -c "import eq_mcp.server as s; assert s.MCP_AVAILABLE, 'FastMCP import is broken -- the mcp pin regressed; the MCP suites would skip instead of run'"
          # numpy = the array dtype the python wrappers (python/<mod>lib/
          # _ffi.py) use for state arrays. It is guarded as optional there
          # (try/except ImportError), but the TEST suite assumes it present:
          # mcp-servers/<mod>/tests/test_server.py does a bare `import numpy`
          # (collection-ERRORS without it, interrupting the whole run) and
          # eqlib/tests/test_get_psi_rz.py importorskip's it (silently SKIPs).
          # Same run-don't-skip rationale as the mcp install above
          # (CLAUDE.md §Test-suite discipline). The build finally compiling
          # on the merge branch is what first let CI reach pytest and surface
          # this latent gap (base develop never got past the build either).
          pip install numpy

      - name: Provide ../task symlink (module Makefiles hardcode ../task/make.header)
        # bpsd/Makefile and the module Makefiles `include ../task/make.header`,
        # assuming the repo is checked out under a dir named `task`. On a
        # differently-named repo (e.g. the task-merge merge/test sandbox) the
        # checkout is $GITHUB_WORKSPACE/../<repo>, so `../task` does not resolve
        # and the bpsd build dies: "No rule to make target '../task/make.header'".
        # Symlink ../task -> the checkout so the relative include is repo-name
        # agnostic. Guarded below: `ln` does not no-op when the repo is
        # already named `task` (see the inline note).
        run: |
          set -e
          link="$(dirname "$GITHUB_WORKSPACE")/task"
          if [ "$link" = "$GITHUB_WORKSPACE" ]; then
            # Repo is literally named `task`: ../task already resolves to the
            # checkout, so there is nothing to do. Without this guard `ln -sfn`
            # does NOT no-op -- the destination is a real directory, so ln falls
            # back to link-into-directory mode and drops a self-referential
            # `task -> .` symlink INSIDE the checkout (verified on GNU coreutils
            # 8.32 and on BSD ln; both exit 0). Harmless today, but a symlink
            # loop for any future recursive find/tar/artifact-glob step.
            echo "checkout is already .../task - no symlink needed"
          else
            ln -sfn "$GITHUB_WORKSPACE" "$link"
            ls -ld "$link"
          fi

      - name: Build PIC support libraries (bpsd, lib, mtxp, pl, eq, dp, ob)
        # Pre-build all shared support libraries so each module Makefile
        # finds the .mod files it needs (bpsd, libitp, equnit, plcomm,
        # etc.) before compiling module sources. Order matters: bpsd
        # first because pl/plvmec USEs bpsd; pl needs lib first; eq
        # needs pl; dp+ob need pl/eq.
        #
        # BPSD's static `make libbpsd.a` populates ../../bpsd/mod/ which
        # PL's PIC build (MODINCLUDE_PIC includes ../../bpsd/mod) needs.
        run: |
          set -e
          make -C "$GITHUB_WORKSPACE/../bpsd" libbpsd.a
          make -C lib libtask_pic.a libgrf_pic.a libmds_pic.a
          make -C mtxp libmtxnompi_pic.o libmtxbnd_pic.o
          # bpsd_pic must run from a module dir (the rule lives in each
          # module's Makefile, generates obj/pic/bpsd/*.o + mod_pic/bpsd*.mod
          # local to that module). Use tr as the canonical builder.
          make -C tr bpsd_pic
          make -C pl libpl_noeq_pic
          make -C eq libeq_pic.a
          make -C pl libpl_pic.a
          make -C dp libdp_pic.a
          make -C ob libob_pic.a
          # adf11 + adpost are needed by ti (USEs adf11 in tiadas.f90)
          make -C open-adas/adf11/adf11-lib lib-adf11_pic.a
          make -C adpost lib-adpost_pic.a

      - name: Build module shared libraries (.so)
        # Each libXapi.so excludes graphics so X11 is not linked. Build
        # order is enforced by each Makefile's libs_pic prerequisite
        # chain (lib_pic -> mtxp_pic -> pl_pic -> eq_pic -> dp_pic /
        # ob_pic -> module .so).
        #
        # We invoke `bpsd_pic` BEFORE the .so target on each module
        # because individual objects like obj/pic/trcom0.o use
        # bpsd_kinds.mod but don't explicitly depend on it; without an
        # explicit prior bpsd_pic step, sequential make fails with
        # "Cannot open module file 'bpsd_kinds.mod'".
        #
        # IMPORTANT: tot MUST come last in this loop. tot/Makefile:378
        # links libtotapi.so against ../eq/libeqapi.so + ../tr/libtrapi.so
        # + ../fp/libfpapi.so, so those .so files must already exist.
        #
        # If any .so fails to build we want the job to FAIL (not skip
        # the dependent pytest cases). `set -e` (also default in GH
        # Actions bash) ensures that.
        run: |
          set -e
          for mod in tr fp ti wr wrx eq tot; do
            echo "::group::Building $mod/lib${mod}api.so"
            # tot has no bpsd_pic target (it links against the other
            # modules' .so directly, not per-module bpsd PIC objs).
            if [[ "$mod" != "tot" ]]; then
              make -C "$mod" bpsd_pic
            fi
            make -C "$mod" "lib${mod}api.so"
            echo "::endgroup::"
          done

      - name: Run orchestrator Layer 2 + Layer 4 C ABI checks (tot_api_check_all)
        # Phase L-6 composite target. Builds and runs every C ABI driver:
        #   tot_api_check    -> test_smoke + test_param  (Layer 3 dispatcher)
        #   tot_api_check_so -> test_run_so via dlopen   (Layer 4)
        #   test_negative                                (Layer 6 negative)
        #   test_full_cycle                              (Layer 6 happy path)
        #
        # The static-link drivers (smoke / param / negative / full_cycle)
        # need the non-PIC archive chain (libtask.a / libgrf.a /
        # libmds.a / libtr2.a / libeq.a / libpl.a / ...) plus per-module
        # API .o files. tot/Makefile's $(LIBS) prerequisite list is
        # *unordered* — make is free to build ../tr/libtr2.a before
        # ../lib/libtask.a, and tr's compile then fails because
        # lib/mod/libitp.mod (produced by the non-PIC libtask build) is
        # not yet present. The `make -C tot libs` target encodes the
        # correct topological order in a single shell recipe, so we run
        # it first to seed the non-PIC chain. tot_api_check_all then
        # links against an already-bootstrapped tree.
        #
        # graphics-symbol resolution is handled by tot/tot_static_stubs.f90
        # (~100 GSAF no-op stubs) so the `GFLIBS=` empty workflow
        # variant links cleanly without libgsp / libg3d. Runs before
        # pytest so a broken orchestrator surfaces here instead of as a
        # cascade of confusing pytest failures.
        run: |
          make -C tot libs
          make -C tot tot_api_check_all

      - name: Generate Layer 1 (1e-10 equivalence) eqdata baselines (demo2014 + ht6m)
        # Build the standalone `tot` Fortran binary (graphics-free via
        # the same tot_static_stubs.o gate as the Layer 2 C drivers)
        # and run the two Layer 1 short cases to produce the eqdata
        # files that test_equivalence.py needs:
        #   - tot_demo2014_short/eqdata.demo2014  (analytic equilibrium)
        #   - tot_ht6m_short/eqdata-HT6M          (file-based MODELG=3)
        #
        # The Phase 0 metrics.json baselines are already committed
        # under test_run/baselines/<case>/. The Python test prefers
        # this CI-generated eqdata over the committed fixtures under
        # python/totlib/tests/fixtures/ (see _isolated_cwd_with_eqdata),
        # so a fresh standalone-binary build is the strongest current
        # signal; the fixtures are the silent-SKIP safety net only.
        #
        # Why ht6m needs eqparm/trparm staging while demo2014 does
        # not: the demo2014 .in script supplies the &eq namelist
        # inline via the eq menu's `p` command, whereas the ht6m .in
        # script issues the eq/tr menus' `r` (read) command which
        # makes totmain.f90's eq_parm(1,'eqparm',IERR) /
        # tr_parm(1,'trparm',IERR) calls read from companion files.
        # The cp lines below mirror what test_run/run_tests.sh stages
        # for the standalone driver (tot module branch).
        run: |
          set -eo pipefail
          make -C tot tot
          for case in tot_demo2014_short tot_ht6m_short; do
            mkdir -p "test_run/test_output/$case"
            # Stage namelist companions at the literal names totmain
            # reads. ht6m REQUIRES both -- .trparm is what sets
            # modelg=3 / knameq='eqdata-HT6M'. Losing it silently would
            # run from defaults, produce a plausible non-empty eqdata,
            # pass `test -s` below, and surface later as library-looking
            # drift in test_equivalence.py. demo2014 ships neither
            # companion, so it stays best-effort -- same convention as
            # run_tests.sh, but no longer applied where it can hide a
            # real staging failure.
            if [ "$case" = "tot_ht6m_short" ]; then
              cp "test_run/inputs/${case}.eqparm" "test_run/test_output/$case/eqparm"
              cp "test_run/inputs/${case}.trparm" "test_run/test_output/$case/trparm"
            else
              cp "test_run/inputs/${case}.eqparm" "test_run/test_output/$case/eqparm" 2>/dev/null || true
              cp "test_run/inputs/${case}.trparm" "test_run/test_output/$case/trparm" 2>/dev/null || true
            fi
            ( cd "test_run/test_output/$case" && \
                ../../../tot/tot < "../../inputs/${case}.in" > output.log 2>&1 )
          done
          # `test -s` (non-zero size) catches the case where the
          # standalone tot exits cleanly but produces a truncated /
          # empty eqdata file — `test -f` alone would let that slip
          # through and surface as a confusing pytest failure later.
          test -s "test_run/test_output/tot_demo2014_short/eqdata.demo2014" \
            || { echo "ERROR: eqdata.demo2014 not produced or empty"; tail -50 "test_run/test_output/tot_demo2014_short/output.log"; exit 1; }
          test -s "test_run/test_output/tot_ht6m_short/eqdata-HT6M" \
            || { echo "ERROR: eqdata-HT6M not produced or empty"; tail -50 "test_run/test_output/tot_ht6m_short/output.log"; exit 1; }
          ls -l test_run/test_output/tot_demo2014_short/ test_run/test_output/tot_ht6m_short/
          # Same two digests the mono job now prints, so the eqdata each
          # job actually feeds test_equivalence.py can be compared
          # straight from the logs rather than inferred.
          echo "tier1 (generated here):"
          sha256sum test_run/test_output/tot_ht6m_short/eqdata-HT6M
          echo "tier2 (committed fixture):"
          sha256sum python/totlib/tests/fixtures/eqdata-HT6M \
            || echo "(tier2 fixture absent)"

      - name: Run pytest (FFI + layout + serialization coverage)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # python/mcp-servers is on the path so `import <mod>_mcp` and the
          # `python -m <mod>_mcp.server` subprocesses in mcp-servers/<mod>/
          # tests/test_{server,save_tool,get_psi_rz_tool}.py resolve. The
          # subprocesses inherit this env (test passes env={**os.environ}),
          # so PYTHONPATH must carry it. The wrappers under python/ stay
          # pure-Python (no install needed), per each mcp pyproject.
          PYTHONPATH: python:python/mcp-servers
          # Baseline-capture: the equivalence tests' _compare_with_baseline ALSO
          # dumps each case's freshly computed `actual` metrics.json under this
          # dir (additive — does NOT change pass/fail), so the CI compiler's
          # values can be downloaded from the artifact below and committed as
          # updated baselines after an intended physics change. See
          # docs/superpowers/decisions/2026-06-29-tot-ht6m-qsolver-baseline.md.
          REGEN_OUTPUT_DIR: regen-output
          # WRX_RUN_OK default ON (2026-04-22): the original SIGABRT
          # cause was libgrf::grd1d from wr_calc_pwr walking an
          # uninitialized grf_attr_type; PR #123 set WRX_NO_GRAPHICS=1
          # inside wrx_api_init to suppress the libgrf path, and
          # PR #163 added EQFINI to rearm the eq_bpsd_init_flag SAVE
          # so suite-level reinit cycles no longer SEGV. With both
          # fixes in place the original CI rationale for gating is
          # obsolete, and defaulting the gate ON lets CI exercise the
          # full lib_run() surface — crucial because "skip in CI"
          # silently hides regressions (CLAUDE.md §Test-suite discipline).
          # WRX_REINIT_OK was retired at the Fortran level (see
          # wrx/wrcomm.f90:214) and is no longer read by any test —
          # not setting it here.
          WRX_RUN_OK: "1"
        run: |
          # Full test surface. No --ignore-glob or --deselect per
          # MEMORY.md feedback_never_skip_tests + feedback_
          # equivalence_must_pass: SKIPped tests do not count as
          # verification. BPSD heap-corruption root cause is fixed
          # by the patched fork k-yoshimi/bpsd@develop cloned above
          # (PR #140, upstream emailed 2026-04-22). property_boundary
          # and property_fanout are the remaining flaky class; the
          # original NSMAX-range PR added range guards (one of the
          # three known-bug triplet) and un-ignored the property
          # suites so CI verifies the guard in action. Follow-up PRs
          # will fix tr NRMAX registry gap + wr MDLWRI=2 to make the
          # property tests pass fully.
          #
          # --forked keeps process isolation so any single still-bad
          # test does not take down the whole suite.
          python -m pytest python/ \
            --forked \
            --timeout=120 \
            --timeout-method=signal \
            --tb=short \
            -ra \
            --maxfail=50

      - name: Upload captured equivalence metrics (CI-compiler baselines)
        if: always()
        # The equivalence tests dumped each case's actual metrics.json under
        # regen-output/ (REGEN_OUTPUT_DIR above). `always()` so this runs even
        # when an equivalence test FAILs (which is exactly when a baseline needs
        # updating). Download + commit the relevant case(s) as the new
        # baseline after the physics change has been reviewed/approved.
        uses: actions/upload-artifact@v4
        with:
          name: equivalence-actuals-${{ matrix.python-version }}-${{ github.run_id }}
          path: regen-output/
          if-no-files-found: ignore
          retention-days: 30

      - name: Show collected vs skipped summary
        if: always()
        env:
          PYTHONPATH: python:python/mcp-servers
        run: |
          python -m pytest python/ --collect-only -q | tail -5 || true

  mono-build:
    # Linux build-only validation of the L-7b-ii monolithic mode
    # (`make -C tot libtotapi_mono.so`). The mono Makefile target has
    # only ever been built on macOS arm64 in PR #202; this job exercises
    # the Linux ld branch (`-Wl,--start-group/--end-group` +
    # `-Wl,--unresolved-symbols=ignore-all` + `-Wl,-soname`) before
    # #201 (Phase 2 of L-7b-ii) starts depending on it.
    #
    # Scope: BUILD ONLY. We do NOT run the 1e-10 equivalence test or
    # the BPSD smoke test against libtotapi_mono.so here — those are
    # blocked on the unified graphics-stub source that #201 Phase 2a
    # will introduce. This job validates: (1) link succeeds on Linux,
    # (2) bpsd storage symbols dedupe to one set (the central PoC
    # claim), (3) no per-module `lib*api.so` deps leak in.
    name: mono build (Linux libtotapi_mono.so)
    runs-on: ubuntu-latest
    # Generous cap: full PIC chain + 5 per-module .so + mono link
    # is roughly 5-8 minutes on the GitHub runner. The eqdata step
    # adds the full NON-PIC chain on top (`make -C tot libs`, ~16
    # archives) plus two short tot runs — measured at 51s from a
    # pristine clone on an M-series Mac, so call it 2-4 min on the
    # runner. 15 was already only ~2x the estimate; 20 keeps the
    # same slack rather than trading a fast red for a timeout red.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fortran/C build deps
        # Same toolchain as the pytest job. The image's gfortran is 13.3.0
        # and has been since at least 2026-06-28 (measured: runs 28327720495
        # and 30516807586 both log `GNU Fortran (Ubuntu 13.3.0-...) 13.3.0`).
        # The "13.2" quoted in older commit messages is the apt metapackage
        # revision 4:13.2.0-7ubuntu1, not the compiler. No Python / pytest
        # needed here.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran gcc make
          gfortran --version | head -1

      - name: Clone BPSD (patched fork k-yoshimi/bpsd@develop)
        # Mirrors the pytest job's BPSD provisioning step. Out-of-tree
        # location at $GITHUB_WORKSPACE/../bpsd matches what every
        # module Makefile expects (BPSD_SRC=../../bpsd).
        run: |
          set -e
          if ! git clone --depth 1 --branch develop \
                 https://github.com/k-yoshimi/bpsd.git \
                 "$GITHUB_WORKSPACE/../bpsd"; then
            echo "ERROR: Could not clone k-yoshimi/bpsd@develop." >&2
            exit 1
          fi
          ls -la "$GITHUB_WORKSPACE/../bpsd" | head -5

      - name: Provision mtxp/make.mtxp from nompi template
        run: |
          cp mtxp/make.mtxp.nompi mtxp/make.mtxp
          head -5 mtxp/make.mtxp

      - name: Provision make.header for Linux gfortran (no graphics)
        # KEEP IN SYNC with the pytest job's identically-named step
        # (~line 110 of this file). Both heredocs must be byte-identical:
        # if a flag drifts in one (e.g. OFLAGS, DFLAGS) and not the
        # other, the mono CI job will silently validate a different
        # compiler-flag shape than the per-module .so path that pytest
        # exercises — i.e. CI would go green while the binaries we
        # actually ship under each path diverge. The composite-action
        # extraction that would enforce this structurally is tracked as
        # follow-up; until then, mirror manually.
        run: |
          cat > make.header <<'HEADER_EOF'
          ### CI-generated make.header (Linux gfortran, no graphics, no MPI)
          LAPACK = nolapack.f
          LIBLA =
          MODLA95 =
          MDSPLUS = nomdsplus.f
          MDSLIB =
          MF77 = mpif77
          MF90 = mpif90
          MF95 = mpif90
          MFC  = $(MF90)

          ## linux gfortran (64bit), no graphics linkage (libXapi.so path)
          GFLIBS=
          OFLAGS = -g -O3 -m64 -std=legacy
          DFLAGS = -g -m64 -fbounds-check -ffpe-trap=invalid,zero,overflow -fbacktrace -fcheck=all -std=legacy
          FCFIXED = gfortran -ffixed-form
          FCFREE = gfortran -ffree-form
          MOD = mod
          MODDIR = -Jmod
          LD=ld
          LDFLAGS=-r -o
          FPP=
          HEADER_EOF
          head -10 make.header

      - name: Build PIC support libraries (bpsd, lib, mtxp, pl, eq, dp, ob, adf11, adpost)
        # Mirrors the pytest job's PIC-support step. The mono Makefile
        # target links these as `LIBS_PIC_MONO`, so they must exist
        # before the mono link runs.
        run: |
          set -e
          make -C "$GITHUB_WORKSPACE/../bpsd" libbpsd.a
          make -C lib libtask_pic.a libgrf_pic.a libmds_pic.a
          make -C mtxp libmtxnompi_pic.o libmtxbnd_pic.o
          make -C tr bpsd_pic
          make -C pl libpl_noeq_pic
          make -C eq libeq_pic.a
          make -C pl libpl_pic.a
          make -C dp libdp_pic.a
          make -C ob libob_pic.a
          make -C open-adas/adf11/adf11-lib lib-adf11_pic.a
          make -C adpost lib-adpost_pic.a

      - name: Build per-module .so files (tr fp ti wr wrx eq — 6 total)
        # libtotapi_mono.so's prereq list is $(LIBS_PIC_SO), which
        # names 5 .so files: eq/libeqapi.so + tr/libtrapi.so +
        # fp/libfpapi.so + ti/libtiapi.so + wrx/libwrxapi.so. We
        # additionally build wr/libwrapi.so (6th, NOT a mono prereq)
        # for symmetry with the pytest job above, so a future
        # composite-action refactor sees a single canonical module
        # list. The wr build adds ~30s on a job that takes ~5-8 min;
        # the symmetry value beats the time cost.
        #
        # We deliberately do NOT build tot/libtotapi.so here (the
        # default per-module path) because this job validates only the
        # mono target.
        run: |
          set -e
          for mod in tr fp ti wr wrx eq; do
            echo "::group::Building $mod/lib${mod}api.so"
            make -C "$mod" bpsd_pic
            make -C "$mod" "lib${mod}api.so"
            echo "::endgroup::"
          done

      - name: Build libtotapi_mono.so (THE target under test)
        # The L-7b-ii PoC core: links all per-module PIC objects + ONE
        # canonical bpsd PIC set into a single image, instead of going
        # through five separate per-module .so files (each carrying its
        # own private bpsd storage). On macOS this builds cleanly; this
        # step is the first time the Linux ld branch (`--start-group`,
        # `--unresolved-symbols=ignore-all`, `-soname`) is exercised
        # in CI.
        run: |
          make -C tot libtotapi_mono.so

      - name: Inspect libtotapi_mono.so (8-bpsd + no-lib*api.so-deps hard-gated)
        # libtotapi_mono_inspect runs TWO hard-gates plus several
        # observational checks:
        #
        # HARD GATE 1: BPSD storage symbol count == 8 (one per bpsd module
        #   type: device + equ1d + metric1d + plasmaf + shot + species +
        #   trmatrix + trsource). If the per-module dedup ever fails
        #   and we get 5×8=40 (or any other count), the build fails.
        #
        # HARD GATE 2: No `lib*api.so` runtime dep in the .so's NEEDED
        #   list (Linux `ldd`) / load commands (macOS `otool -L`). The
        #   whole point of the mono build is that it has no per-module
        #   .so deps; if any leak in, fail loudly.
        #
        # Observational (printed, NOT enforced as exit code):
        #   - exported tot_* symbol list.
        #   - file size.
        run: |
          make -C tot libtotapi_mono_inspect

      - name: Set up Python (for the mono equivalence step below)
        # The mono-build job is otherwise Python-free; pytest is only
        # needed for the equivalence step. Pinning to 3.11 (one of the
        # versions the pytest job's matrix exercises) keeps the
        # behavior aligned without doubling on both 3.11 + 3.13.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest deps for the mono equivalence step
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-forked pytest-timeout pytest-mock

      - name: Generate Layer 1 (1e-10 equivalence) eqdata baselines (demo2014 + ht6m)
        # KEEP IN SYNC with the identically-named step in the `pytest`
        # job, with ONE intended divergence: the `make -C tot libs` line
        # below, which that job already has as a separate earlier step.
        #
        # Without this step the two jobs feed test_equivalence.py from
        # DIFFERENT tiers of `_isolated_cwd_with_eqdata`
        # (python/totlib/tests/test_equivalence.py:103-115):
        #
        #   tier 1  test_run/test_output/<case>/eqdata-*   copied always
        #   tier 2  python/totlib/tests/fixtures/eqdata-*  copied only
        #                                                  `if not exists`
        #
        # The pytest job runs this step, so it gets tier 1. This job did
        # not, so it fell through to the committed tier-2 fixture — the
        # one input that differed between the passing pytest run and the
        # failing mono run. That made "mono diverges by 2.2e-06..3.7e-04
        # on tot_ht6m_short" un-attributable: library or input?
        #
        # The committed fixture stays as the fallback for local runs
        # (and is what test_mono_bpsd_smoke.py uses directly), so this
        # does not make it dead weight.
        run: |
          set -eo pipefail
          # `make -C tot libs` FIRST. This job builds only PIC artefacts
          # (obj/pic + mod_pic), and tot/Makefile's `tot` target pulls in
          # the NON-PIC chain: $(LIB_MTX) resolves to ../mtxp/libmtx*.o,
          # whose first compile is `USE task_kinds` from lib/libtask.a,
          # and $(LIBS) lists libgrf.a before libtask.a even though
          # libgrf needs task_kinds.mod. Neither exists here. `libs`
          # encodes the correct topological order in one recipe -- the
          # same reason the pytest job runs it (see its comment above).
          #
          # Verified in a pristine clone with only make.header +
          # make.mtxp provisioned: `make -C tot tot` alone dies with
          # "Fatal Error: Cannot open module file 'task_kinds.mod'";
          # `libs` then `tot` succeeds. Measured 50s + 1s on macOS.
          make -C tot libs
          make -C tot tot
          for case in tot_demo2014_short tot_ht6m_short; do
            mkdir -p "test_run/test_output/$case"
            # ht6m REQUIRES both companions -- .trparm is what sets
            # modelg=3 / knameq='eqdata-HT6M'. Losing it silently would
            # run from defaults, produce a plausible non-empty eqdata,
            # pass `test -s`, and surface later as library-looking drift:
            # precisely the misattribution this step exists to kill. So
            # ht6m copies hard and demo2014 (which ships neither) stays
            # best-effort.
            if [ "$case" = "tot_ht6m_short" ]; then
              cp "test_run/inputs/${case}.eqparm" "test_run/test_output/$case/eqparm"
              cp "test_run/inputs/${case}.trparm" "test_run/test_output/$case/trparm"
            else
              cp "test_run/inputs/${case}.eqparm" "test_run/test_output/$case/eqparm" 2>/dev/null || true
              cp "test_run/inputs/${case}.trparm" "test_run/test_output/$case/trparm" 2>/dev/null || true
            fi
            ( cd "test_run/test_output/$case" && \
                ../../../tot/tot < "../../inputs/${case}.in" > output.log 2>&1 )
          done
          test -s "test_run/test_output/tot_demo2014_short/eqdata.demo2014" \
            || { echo "ERROR: eqdata.demo2014 not produced or empty"; tail -50 "test_run/test_output/tot_demo2014_short/output.log"; exit 1; }
          test -s "test_run/test_output/tot_ht6m_short/eqdata-HT6M" \
            || { echo "ERROR: eqdata-HT6M not produced or empty"; tail -50 "test_run/test_output/tot_ht6m_short/output.log"; exit 1; }
          ls -l test_run/test_output/tot_demo2014_short/ test_run/test_output/tot_ht6m_short/
          # Record both digests so the next divergence is attributable
          # from the log alone. `|| echo` on tier 2 keeps the diagnostic
          # a diagnostic: the fixture is slated for regeneration, and its
          # absence must not fail THIS step and point at the wrong thing.
          echo "tier1 (generated here):"
          sha256sum test_run/test_output/tot_ht6m_short/eqdata-HT6M
          echo "tier2 (committed fixture):"
          sha256sum python/totlib/tests/fixtures/eqdata-HT6M \
            || echo "(tier2 fixture absent)"

      - name: 1e-10 equivalence test against libtotapi_mono.so
        id: mono_equivalence
        # Phase 2a deliverable (#201): with the unified
        # tot_graphics_stubs_mono.f90 in place, libtotapi_mono.so is
        # now dlopen-loadable via Python ctypes. Running the existing
        # totlib equivalence fixtures against it verifies the mono
        # image is a faithful drop-in replacement for the default
        # libtotapi.so on the existing test surface — required for
        # CLAUDE.md "equivalence tests at 1e-10 MUST pass."
        #
        # These fixtures don't exercise BPSD-mediated coupling, so
        # this is a regression check that the mono build hasn't
        # broken the existing path. The Layer-C BPSD smoke step below
        # validates the broker-sharing claim specifically (Phase 2b).
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: python
          TOTLIB_PATH: ${{ github.workspace }}/tot/libtotapi_mono.so
        run: |
          python -m pytest python/totlib/tests/test_equivalence.py -v \
            --forked --timeout=120 --timeout-method=signal

      - name: Build default libtotapi.so (needed for Layer-C C-3 test)
        # `!cancelled()` on this and the three mono steps that follow, so
        # a red equivalence step no longer suppresses them. They answer
        # DIFFERENT questions — "is mono a drop-in on the existing
        # surface" vs "does mono share one BPSD broker / route all six
        # wrappers / couple through the pipeline" — and the latter are
        # the more diagnostic exactly when the former goes red. That was
        # the position #226's mono failure left us in: the job died at
        # the equivalence step and produced zero evidence about any of
        # the mono-specific claims.
        #
        # The condition is `!cancelled()` AND the equivalence step was
        # not itself SKIPPED, not a bare `!cancelled()`. A bare one also
        # means "run after a failed BUILD step" — and on that path
        # `Set up Python` and the pip install (still success()-gated)
        # have skipped, so these steps would reach `python -m pytest`
        # with no interpreter and report three red steps blaming Python
        # tooling for a Fortran build failure. `conclusion != 'skipped'`
        # is true exactly when the equivalence step actually ran, so an
        # earlier build failure stops the job where it always did, while
        # an equivalence FAILURE still yields the mono-specific evidence.
        #
        # The three test steps additionally assert their .so inputs
        # exist, so they fail loudly rather than degrading into a green
        # "3 skipped" via their own skipUnless — CLAUDE.md is explicit
        # that a skip is invisibility, not evidence.
        #
        # This does not weaken the equivalence gate: that step's failure
        # still fails the job (CLAUDE.md "equivalence tests at 1e-10 MUST
        # pass"). It only stops that failure from suppressing evidence.
        #
        # Phase 2b deliverable (#201): the Layer-C smoke test below
        # includes TestDistinguishesPerModule which checks that the
        # default per-module libtotapi.so reports tot_is_mono() == 0,
        # confirming the runtime distinguishing mechanism actually
        # discriminates between the two builds. We need both .so files
        # present for that. Build it AFTER the mono inspect / mono
        # equivalence steps so a regression in the mono path can't
        # be masked by a default-path failure.
        if: ${{ !cancelled() && steps.mono_equivalence.conclusion != 'skipped' }}
        run: |
          make -C tot libtotapi.so

      - name: Layer-C BPSD broker smoke (mono image vs default)
        # See the preceding step for why this is not gated on success.
        if: ${{ !cancelled() && steps.mono_equivalence.conclusion != 'skipped' }}
        # Phase 2b deliverable (#201): verifies the runtime distinction
        # between the monolithic libtotapi_mono.so and the default
        # libtotapi.so. Three cases:
        #
        #   C-1 (test_mono_flag): tot_is_mono() == 1 on the mono image.
        #   C-2 (test_bpsd_round_trip): drive eq through eq_run(1)
        #     (which calls eq_load -> eq_bpsd_put), then call
        #     tr_check_bpsd_pull, expect ok=1. Demonstrates the
        #     monolithic image's shared BPSD broker.
        #   C-3 (test_distinguishes_per_module): default libtotapi.so
        #     reports tot_is_mono() == 0.
        #
        # Process isolation: --forked is mandatory because the mono .so
        # carries module-level state (bpsd broker slots, trcomm, eq
        # common blocks) that bleeds across pytest cases in the same
        # process. Without isolation a prior test's eq push could make
        # the round-trip check pass for the wrong reason (Codex
        # retrospective 2026-05-15 item 5).
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: python
          MONO_LIB_PATH: ${{ github.workspace }}/tot/libtotapi_mono.so
          TOTLIB_PATH: ${{ github.workspace }}/tot/libtotapi.so
        run: |
          # `!cancelled()` means this also runs after a failed BUILD step.
          # Without these two lines the missing .so would trip the tests'
          # own skipUnless and the step would report "3 skipped" as a
          # green tick -- CLAUDE.md: "a SKIPped test is not verification,
          # it is invisibility". Assert the inputs instead.
          test -f "$MONO_LIB_PATH" || { echo "ERROR: $MONO_LIB_PATH missing — the mono build failed earlier in this job"; exit 1; }
          test -f "$TOTLIB_PATH"   || { echo "ERROR: $TOTLIB_PATH missing — the default libtotapi.so build failed"; exit 1; }
          python -m pytest python/totlib/tests/test_mono_bpsd_smoke.py -v \
            --forked --timeout=120 --timeout-method=signal

      - name: Mono routing sanity (Phase 2c PR-A)
        # Un-gated for the same reason as the two steps above: this is
        # one of the mono-specific claims that a red equivalence step
        # used to suppress entirely.
        if: ${{ !cancelled() && steps.mono_equivalence.conclusion != 'skipped' }}
        # #208 PR-A — verify that setting MONO_LIB_PATH routes all 6
        # wrappers (eqlib/trlib/fplib/tilib/wrxlib/totlib) to the
        # monolithic image instead of each loading its per-module .so.
        # This is a SANITY test (plumbing only); the behavioral
        # eq->tr BPSD round-trip lives in PR-B.
        #
        # Re-uses the default libtotapi.so artifact built earlier in
        # this job (the "Build default libtotapi.so" step landed in
        # PR #207) for test_non_mono_so_raises.
        env:
          MONO_LIB_PATH: ${{ github.workspace }}/tot/libtotapi_mono.so
          TOTLIB_PATH: ${{ github.workspace }}/tot/libtotapi.so
          PYTHONPATH: python
        run: |
          test -f "$MONO_LIB_PATH" || { echo "ERROR: $MONO_LIB_PATH missing — the mono build failed earlier in this job"; exit 1; }
          test -f "$TOTLIB_PATH"   || { echo "ERROR: $TOTLIB_PATH missing — the default libtotapi.so build failed"; exit 1; }
          python -m pytest python/totlib/tests/test_mono_routing.py \
                 --forked --timeout=120 --timeout-method=signal -v

      - name: Mono pipeline coupling (Phase 2c PR-B)
        # Un-gated for the same reason as the three steps above.
        if: ${{ !cancelled() && steps.mono_equivalence.conclusion != 'skipped' }}
        # #208 PR-B — drives eq -> tr through TotPipeline.run_pipeline
        # on the mono image and asserts the ("eq","tr") verify rule
        # fires (TestEqToTrPipelineCoupling). Also exercises the
        # negative case via TestEqToTrRuleDormantOnDefault — that
        # test skip-gates on the per-module .so files at the repo
        # default paths (eq/libeqapi.so, tr/libtrapi.so,
        # tot/libtotapi.so), which the per-module build steps
        # earlier in this job have already produced.
        #
        # TOTLIB_PATH is set so the totlib wrapper picks the
        # default libtotapi.so from the workspace consistently with
        # other tests in this job. eqlib / trlib do NOT honor
        # TOTLIB_PATH; they resolve via the repo default at
        # workspace/eq/libeqapi.so etc.
        env:
          MONO_LIB_PATH: ${{ github.workspace }}/tot/libtotapi_mono.so
          TOTLIB_PATH: ${{ github.workspace }}/tot/libtotapi.so
          PYTHONPATH: python
        run: |
          test -f "$MONO_LIB_PATH" || { echo "ERROR: $MONO_LIB_PATH missing — the mono build failed earlier in this job"; exit 1; }
          test -f "$TOTLIB_PATH"   || { echo "ERROR: $TOTLIB_PATH missing — the default libtotapi.so build failed"; exit 1; }
          python -m pytest python/totlib/tests/test_mono_pipeline_coupling.py \
                 --forked --timeout=120 --timeout-method=signal -v

  uncovered-modules-build:
    # Compile-only coverage for the modules the pytest job does NOT build.
    #
    # The pytest job builds tr/fp/ti/wr/wrx/eq/tot; `make -C tot libs` adds
    # pl/dp/wmx/ob/adf11/adpost. That leaves equ/ trx/ txnew/ wf2dt/ wim/ wm/
    # trm/ wmf/ wmfn/ with NO CI coverage at all — and every one of them is
    # substantially touched by the bpsi merge. In PR #226 that gap let a batch
    # of hard compile/link breakages (a bare PT added to plcomm_parm colliding
    # with local PTs, pl_view moving plparm->plview, raw DGETRF/DGETRS with no
    # LAPACK shim) reach human review instead of being caught by the pipeline.
    #
    # Scope: BUILD ONLY, and library targets rather than the standalone
    # binaries — the binaries pull in graphics (gsaf) and MPI link paths that
    # this headless runner deliberately does not provide. Compiling every
    # source in these directories is what catches the defect class above.
    #
    # NOT included, because they do not build on `develop` either (verified
    # byte-identical there, so they are pre-existing rather than merge
    # regressions — adding them would make this job red on day one):
    #   fpx    — fpcomm.f90 `IF(ALLOCATED(SAVPOS))` where SAVPOS is not
    #            declared ALLOCATABLE in that scope
    #   wmseki — 'pl_wmxprf'/'wmspl_prof' not found in module plprof
    #   dpseki — links only against the MPI mtxp variant
    # Add them here as they are fixed.
    name: build modules not covered by pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fortran/C build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran gcc make
          gfortran --version | head -1

      - name: Clone BPSD (patched fork k-yoshimi/bpsd@develop)
        run: |
          set -e
          git clone --depth 1 --branch develop \
            https://github.com/k-yoshimi/bpsd.git "$GITHUB_WORKSPACE/../bpsd"
          ls -la "$GITHUB_WORKSPACE/../bpsd" | head -5

      - name: Provision mtxp/make.mtxp from nompi template
        run: cp mtxp/make.mtxp.nompi mtxp/make.mtxp

      - name: Provision make.header for Linux gfortran (no graphics)
        # KEEP IN SYNC with the pytest and mono-build jobs' identically-named
        # steps. Same caveat as there: a flag that drifts in one heredoc and
        # not the others means CI validates a different compiler-flag shape
        # than the artifacts we ship.
        run: |
          cat > make.header <<'HEADER_EOF'
          ### CI-generated make.header (Linux gfortran, no graphics, no MPI)
          LAPACK = nolapack.f
          LIBLA =
          MODLA95 =
          MDSPLUS = nomdsplus.f
          MDSLIB =
          MF77 = mpif77
          MF90 = mpif90
          MF95 = mpif90
          MFC  = $(MF90)

          ## linux gfortran (64bit), no graphics linkage (libXapi.so path)
          GFLIBS=
          OFLAGS = -g -O3 -m64 -std=legacy
          DFLAGS = -g -m64 -fbounds-check -ffpe-trap=invalid,zero,overflow -fbacktrace -fcheck=all -std=legacy
          FCFIXED = gfortran -ffixed-form
          FCFREE = gfortran -ffree-form
          MOD = mod
          MODDIR = -Jmod
          LD=ld
          LDFLAGS=-r -o
          FPP=
          HEADER_EOF
          head -10 make.header

      - name: Build support libraries
        # Non-PIC counterparts of the pytest job's PIC support step; these
        # provide the .mod files the uncovered modules compile against.
        run: |
          set -e
          make -C "$GITHUB_WORKSPACE/../bpsd" libbpsd.a
          make -C lib libtask.a libgrf.a libmds.a
          make -C mtxp libmtxnompi.o libmtxbnd.o
          make -C pl libpl.a
          make -C eq libeq.a
          make -C dp libdp.a
          # trx/ and trm/ compile against trlib's .mod files (trcdbm,
          # cytran_mod, modmmm95, modmmm7_1, mixed_Bohm_gyro_Bohm) via
          # `-I../trlib/$(MOD)`, and neither libtr2.a target bootstraps it.
          # Only trlib/mod/dummy is tracked, so a fresh clone has none of them.
          make -C trlib libtrm.a
          # equ/: `libequ.a: $(OBJS)` covers SRCS only, while equcomm.f90 (which
          # defines aaa_mod, USEd by most of SRCS) lives in the separate SRCC/OBJC
          # variable. Building the library target alone therefore cannot succeed
          # from clean -- equcomm.o has to come first.
          make -C equ obj/equcomm.o

      - name: Compile the uncovered modules
        # Library targets only — see the job comment.
        run: |
          set -e
          fail=0
          for spec in equ:libequ.a trx:libtr2.a txnew:libtx3.a wf2dt:libwf.a \
                      wim:libwim.a trm:libtr2.a wm:libwm.a wmf:libwm.a wmfn:libwm.a; do
            dir="${spec%%:*}"; target="${spec#*:}"
            echo "::group::make -C $dir $target"
            if make -C "$dir" "$target"; then
              echo "OK   $dir/$target"
            else
              echo "::error title=$dir failed to build::make -C $dir $target"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"
