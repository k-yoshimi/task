[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fp-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for the TASK/FP Fokker-Planck code (wraps python/fplib)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Same as TASK repository" }
authors = [
    { name = "TASK contributors" }
]
keywords = ["mcp", "model-context-protocol", "task", "plasma", "fokker-planck", "fortran", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # Python MCP SDK (https://github.com/modelcontextprotocol/python-sdk).
    # FastMCP decorator API lives in mcp.server.fastmcp from 0.9 onward.
    "mcp>=0.9,<2",  # 2.0 removed mcp.server.fastmcp
    # fplib は同一リポジトリ内 path dep (本 pyproject から見て ../../fplib).
    # pip install 時は repo root を PYTHONPATH に通すか、path install する:
    #   pip install -e .
    #   (fplib 自体は pure-Python なので site-packages への install は不要)
    # ここではハード依存として列挙しない (fplib は repo 付属で配布されるため)。
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
fp-mcp = "fp_mcp.server:main"

# pyproject.toml sits inside the fp_mcp/ package dir itself (flat layout),
# so find_packages can't discover an "fp_mcp" subdirectory. Map the package
# name explicitly to "." instead.
[tool.setuptools]
packages = ["fp_mcp"]

[tool.setuptools.package-dir]
fp_mcp = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
