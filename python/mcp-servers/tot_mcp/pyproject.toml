[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tot-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for the TASK/TOT integrated orchestrator (wraps python/totlib)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Same as TASK repository" }
authors = [
    { name = "TASK contributors" }
]
keywords = ["mcp", "model-context-protocol", "task", "plasma", "transport", "orchestrator", "fortran", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # Python MCP SDK (https://github.com/modelcontextprotocol/python-sdk).
    # FastMCP decorator API lives in mcp.server.fastmcp from 0.9 onward.
    "mcp>=0.9,<2",  # 2.0 removed mcp.server.fastmcp
    # totlib は同一リポジトリ内 path dep (本 pyproject から見て ../../totlib).
    # pip install 時は repo root を PYTHONPATH に通すか、path install する:
    #   pip install -e .
    #   (totlib 自体は pure-Python なので site-packages への install は不要)
    # ここではハード依存として列挙しない (totlib は repo 付属で配布されるため)。
    # 同様に describe_parameters は per-namespace で
    # tr_mcp / ti_mcp / fp_mcp / wrx_mcp の PARAMETER_REGISTRY を遅延 import
    # するが、見つからない名前空間は空辞書扱いになるだけで動作は継続する。
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
tot-mcp = "tot_mcp.server:main"

# pyproject.toml sits inside the tot_mcp/ package dir itself (flat layout),
# so find_packages can't discover a "tot_mcp" subdirectory. Map the package
# name explicitly to "." instead.
[tool.setuptools]
packages = ["tot_mcp"]

[tool.setuptools.package-dir]
tot_mcp = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
